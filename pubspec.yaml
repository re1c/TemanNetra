name: temannetra
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase Core & Services
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4

  # Supabase Storage for voice notes
  supabase_flutter: ^2.14.1

  # AI & Gemini API
  google_generative_ai: ^0.4.0

  # Hardware, Media, & Utilities
  camera: ^0.10.6
  flutter_tts: ^4.1.0
  vibration: 3.1.8
  uuid: ^4.4.0
  record: ^6.0.0
  audioplayers: ^6.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true