# Konfigurasi analisis statis Dart tingkat industri untuk proyek TemanNetra.
# Dokumen ini memastikan standar kualitas penulisan kode, kerapian format, dan mitigasi bug secara dini.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Memaksa tipe data dideklarasikan secara eksplisit untuk mencegah kesalahan casting di runtime
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Mengecualikan kode hasil generator (Riverpod generator & Freezed) dari aturan linting
    - "lib/**/*.g.dart"
    - "lib/**/*.freezed.dart"

linter:
  rules:
    # --- Praktik Terbaik Keamanan & Pengelolaan Sumber Daya ---
    cancel_subscriptions: true      # Mencegah memory leak pada StreamSubscription
    close_sinks: true               # Mencegah memory leak pada Sink / StreamController
    avoid_print: true               # Melarang penggunaan print() di mode produksi (gunakan log/debugPrint)
    
    # --- Struktur & Format Kode (Clean Code) ---
    always_declare_return_types: true  # Memaksa deklarasi tipe kembalian fungsi
    require_trailing_commas: true      # Memaksa koma gantung untuk format kode yang rapi saat auto-format
    prefer_const_constructors: true    # Mengoptimalkan performa rendering widget Flutter dengan const
    prefer_const_declarations: true
    prefer_final_locals: true          # Mendorong immutability variabel lokal
    
    # --- Mitigasi Bug ---
    avoid_empty_else: true
    avoid_relative_lib_imports: true  # Memaksa penggunaan package import alih-alih relative path di luar modul
    prefer_void_to_null: true
    unnecessary_await_in_return: true
